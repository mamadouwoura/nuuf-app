name: Contrôles

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DATABASE_URL_TEST: postgresql://ci:ci@localhost:5432/ci
      SESSION_SECRET: valeur-de-integration-continue-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Migrations (base de test)
        run: npx prisma migrate deploy
      - name: Tests
        run: npm test
      - name: Typage
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint src scripts
      - name: Compilation de production
        run: npm run build
