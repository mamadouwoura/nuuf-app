# Production : base PostgreSQL + migrations + application + proxy HTTPS (Caddy).
# Lancement : docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
name: nuuf

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [interne]
    # Aucun port publié : la base n'est joignable que depuis les autres conteneurs.

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [interne]

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [interne, web]

  # Planificateur : déclenche chaque jour les relances automatiques (J-3, J+1, J+5).
  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    env_file: .env.production
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'while true; do sleep 86400; curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" http://app:3000/api/cron/relances || true; done'
    depends_on:
      - app
    networks: [interne]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAINE: ${DOMAINE}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks: [web]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  interne:
  web:
